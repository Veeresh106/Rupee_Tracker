{% extends 'tracker/base.html' %}

{% block content %}
<div class="auth-page my-3">
    {% include 'tracker/partials/auth_story.html' %}
    <section class="auth-form-panel" aria-labelledby="register-title">
        <div class="auth-form-card">
            <div class="auth-eyebrow">Start fresh</div>
            <h2 id="register-title">Create your account</h2>
            <p class="auth-form-intro">A clearer view of your spending starts here.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary auth-submit w-100">Create account</button>
            </form>
            <p class="mt-4 mb-0 text-center">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
        </div>
    </section>
</div>
{% endblock %}
